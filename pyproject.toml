[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "second-brain-joplin"
dynamic = ["version"]
description = "MCP server that connects Claude Code (and other MCP clients) to your Joplin knowledge base"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "joplin", "second-brain", "claude", "ai", "knowledge-base"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.27",
    "pydantic>=2",
    "python-dotenv>=1.0",
    # Sign-in, the audit log, HTTP serving and the search engine, shared with the
    # other Second Brain servers. 0.x: a new minor version may change its interfaces.
    "second-brain-core>=0.1,<0.2",
]

[project.optional-dependencies]
# Kept for a `pip install -e ".[test]"` fallback; the uv dev group below is the
# primary path.
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "pytest-cov>=5.0", "mypy>=1.11"]

# Semantic search. `semantic` is the light default stack (sqlite-vec + FastEmbed);
# compose with the others to swap backends, e.g. `.[semantic,semantic-st]` for
# bge-m3, or `.[semantic,semantic-chroma]` for the Chroma vector store. Which one
# is used at runtime is chosen by SBJ_VECTOR_STORE / SBJ_EMBEDDING_BACKEND.
semantic = ["second-brain-core[semantic]>=0.1,<0.2"]
semantic-chroma = ["second-brain-core[semantic-chroma]>=0.1,<0.2"]
semantic-st = ["second-brain-core[semantic-st]>=0.1,<0.2"]

[dependency-groups]
dev = [
    "ruff",
    "pre-commit",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
    # The default vector store, so the semantic tests can open a real index. It
    # ships wheels for Linux, macOS and Windows that work on every Python.
    "sqlite-vec>=0.1",
]

[project.urls]
Homepage = "https://github.com/second-brain-tools/second-brain-joplin"
Repository = "https://github.com/second-brain-tools/second-brain-joplin"
Documentation = "https://github.com/second-brain-tools/second-brain-joplin/blob/main/docs/install.md"
Changelog = "https://github.com/second-brain-tools/second-brain-joplin/blob/main/CHANGELOG.md"
Issues = "https://github.com/second-brain-tools/second-brain-joplin/issues"

[project.scripts]
second-brain-joplin = "second_brain_joplin.cli:main"

[tool.hatch.version]
path = "src/second_brain_joplin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain_joplin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The 90% coverage gate is enforced in CI via `--cov-fail-under=90` (see
# .github/workflows/checks.yml). It is intentionally NOT in addopts so that
# running a subset of tests locally (e.g. `pytest tests/test_cli.py`) does not
# spuriously fail the gate. Run `uv run pytest --cov-fail-under=90` to reproduce.
addopts = "--cov=second_brain_joplin --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["second_brain_joplin"]
# The stores and embedders now live in second-brain-core, which tests them.
omit = []

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
ignore_missing_imports = true

